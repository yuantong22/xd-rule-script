<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>UI 风格挑选</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:"PingFang SC","Microsoft YaHei",sans-serif; }
  body { background:#f0f2f5; }
  .bar { position:sticky; top:0; z-index:9; background:#fff; border-bottom:1px solid #e5e7eb; padding:14px 24px; display:flex; gap:16px; align-items:center; }
  .bar h1 { font-size:16px; color:#111827; }
  .bar a { font-size:14px; color:#2563eb; text-decoration:none; border:1px solid #bfdbfe; background:#eff6ff; padding:6px 16px; border-radius:6px; }
  .bar span { font-size:13px; color:#6b7280; }
  section { padding:24px; }
  h2 { font-size:15px; color:#374151; margin-bottom:12px; }
  iframe { width:100%; height:820px; border:1px solid #e5e7eb; border-radius:10px; background:#fff; }
</style>
</head>
<body>
  <div class="bar">
    <h1>三套界面风格对比</h1>
    <a href="style1-light.html" target="_blank">风格一：单独打开</a>
    <a href="style2-dark.html" target="_blank">风格二：单独打开</a>
    <a href="style3-gradient.html" target="_blank">风格三：单独打开</a>
    <span>提示：窗口拉宽一点看效果更好；也可以点链接单独打开某个风格放大看</span>
  </div>
  <section>
    <h2>风格一：清爽浅色 · 经典蓝（Element Plus 风格，耐看、办公感）</h2>
    <iframe src="style1-light.html"></iframe>
  </section>
  <section>
    <h2>风格二：深色代码风（类似 VS Code，程序员氛围、看代码舒服）</h2>
    <iframe src="style2-dark.html"></iframe>
  </section>
  <section>
    <h2>风格三：现代渐变风（蓝紫渐变、大圆角，更年轻活泼）</h2>
    <iframe src="style3-gradient.html"></iframe>
  </section>
</body>
</html>
